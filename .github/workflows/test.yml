name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        run: python -m pip install uv==0.13.7

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Run tests
        run: |
          uv run --frozen pytest --cov=elevenlabs_mcp --cov-report=xml

      - name: Audit locked dependencies
        run: |
          uv export --frozen --no-emit-project --no-hashes --format requirements-txt --output-file audit-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r audit-requirements.txt

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
